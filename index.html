const CATN={scrim:"Scrim",blast:"Blast",paid:"Paid",other:"Other"},MC=["#fbbf24","#cbd5e1","#f97316"];
const orgSel=(n,l,o,v)=>`<label class="text-sm">${l}</label><select name="${n}" class="inp" required>${o.map(([k,t])=>`<option value="${esc(k)}" ${k===v?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
const orgFee=(fee,pz)=>`<label class="text-sm">Entry fee (tk) *</label><input name="fee" inputmode="decimal" class="inp" required placeholder="0 for free" value="${fee??""}"><label class="text-sm">Prize pool by position (tk)</label><div class="grid grid-cols-2 gap-2">${[0,1,2,3,4].map(i=>`<div><label class="text-[11px] text-gray-400">${ord(i+1)} place${i<3?" *":""}</label><input name="pz${i}" inputmode="decimal" class="inp" ${i<3?"required":""} placeholder="${i<3?"Required":"Optional"}" value="${(pz||[])[i]||""}"></div>`).join("")}</div>`;
const dtl=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
function otStat(t){const d=t.time-Date.now();if(t.status==="ended")return"Ended";if(d<=0)return"Live";if(d<36e5)return"Live Soon";return"Starts in "+(d<864e5?Math.ceil(d/36e5)+"h":Math.floor(d/864e5)+"d")}
function otCard(t){const o=orgBy(t.orgKey)||{},r=myReq(t),rm=OR.rooms[t.id],left=t.slots-taken(t),ended=t.status==="ended",ok=mg().length>0,ban=mg().some(s=>(o.bannedSquads||[]).includes(s.id)),cat=CATN[t.cat]?t.cat:"other",pr=t.prize||[];
 const pay=`<div class="kl"><p class="cl">Send entry fee to</p><p class="text-sm mt-1">bKash: ${cpb(o.bk)}</p><p class="text-sm">Nagad: ${cpb(o.ng)}</p></div>`;
 const sq=S.sqs.find(s=>s.id===(S.osq||mg()[0]?.id))||mg()[0];
 const form=S.oreq===t.id&&sq?`<form data-oreq="${t.id}" class="mt-3 space-y-2">${pay}<select name="sq" data-osq class="inp">${mg().map(s=>`<option value="${s.id}" ${s.id===sq.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select><input name="ph" class="inp" inputmode="tel" placeholder="Phone number you paid from" required><select name="m" class="inp"><option>bKash</option><option>Nagad</option></select><input name="trx" class="inp" placeholder="Transaction ID" required>${rosterPick(sq,[],"")}<button class="btn w-full">Send join request</button></form>`:"";
 const act=ended?"":ban?'<div class="inf" style="color:#fca5a5">You cannot join this organizer.</div>':r?(r.status==="accepted"?`<div class="ok mt-3">${ic("check")}You are in this tournament</div>${rm?`<p class="text-sm mt-2">${ic("key","ci")} Room ID: <b class="pu">${cpb(rm.roomId)}</b></p><p class="text-sm">${ic("lock","ci")} Password: <b class="cy">${cpb(rm.roomPw)}</b></p>`:""}`:'<div class="inf mt-3">⏳ Request pending – organizer will review it.</div>'):ok?(left>0?form:""):'<p class="meta mt-2">Only team managers can join.</p>';
 const btn=ended||ban?"":r?(r.status==="accepted"?'<span class="bdg g">Joined</span>':'<span class="bdg a">Pending</span>'):ok&&left>0?`<button class="obuy" data-oopen="${t.id}">Buy Slot ${ic("send")}</button>`:left<=0?'<span class="bdg r">Full</span>':"";
 const lb=t.lbLink?`<img src="${esc(drv(t.lbLink))}" alt="Point table" class="w-full rounded-2xl mt-3" onerror="this.outerHTML='<a class=&quot;soc&quot; target=_blank rel=noopener href=&quot;${esc(safeWeb(t.lbLink))}&quot;>Open point table</a>'">`:"";
 const dd=new Date(t.time);
 return `<div class="card otc"><div class="oth"><img class="olg" src="${CLOGO[cat]}" alt=""><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-2"><span class="bdg p">${CATN[cat]}</span><span class="ost ${otStat(t)==="Live Soon"||otStat(t)==="Live"?"live":""}">${otStat(t)}</span></div><h3 class="otn">${esc(t.name)}</h3><p class="ots">Organized by <a href="#" data-oprof="${t.orgKey}">@${esc(o.name||t.orgKey)}</a>${o.verified?' <span class="vf">✔</span>':""}</p></div></div>
 <div class="ofp"><div><p class="ofl">${ic("ticket")}Entry fee</p><p class="ofee">${+t.fee>0?t.fee+" tk":"Free"}</p></div><div class="ofd"></div><div><p class="ofl">${ic("trophy")}Prize pool</p><p class="opz">${prizeSum(t)} tk</p></div></div>
 <div class="opos">${[0,1,2].filter(i=>pr[i]).map(i=>`<div class="opp"><span class="mdl" style="--c:${MC[i]}">${i+1}</span><div><p>${ord(i+1)}</p><b>৳${pr[i]}</b></div></div>`).join("")}</div>
 <div class="ofoot"><span class="ofi">${ic("calendar")}${dd.toLocaleDateString([],{month:"short",day:"numeric",year:"numeric"})}</span><span class="ofi">${ic("clock")}${dd.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</span><div class="osl"><p>${ended?"Ended":left+" Slots Left"}</p><i><b style="width:${Math.min(100,Math.round(taken(t)/Math.max(1,t.slots)*100))}%"></b></i></div>${btn}</div>
 <details class="mt-2"><summary class="text-sm text-violet-300">Details</summary><p class="meta">🎮 ${esc(t.gameName)} · ${esc(t.type)}${t.start?" · starts "+msFmt(t.start):""}</p><p class="meta">Teams (${taken(t)}/${t.slots}): ${t.hideTeams?"hidden by organizer":(t.teams||[]).map(x=>esc(x.name)).join(", ")||"none yet"}</p></details>${act}${lb}</div>`}
function tours(){if(S.oview){const o=orgBy(S.oview);if(o){const L=OR.tours.filter(t=>t.orgKey===o.id),d=Date.now()-30*864e5,sel=L.filter(t=>t.status!=="ended"),fol=(o.followers||[]).includes(U());
 return `<button class="btn2 mb-3" data-oprof="">← Back</button><div class="card"><h2 class="font-bold text-xl">@${esc(o.name)} ${o.verified?'<span class="bdg g">✔ Verified seller</span>':""}</h2><p class="meta">${L.filter(t=>t.status==="ended").length} tournaments completed · ${(o.followers||[]).length} followers</p><div class="flex gap-2 flex-wrap mt-2">${o.wa?`<a class="soc" target="_blank" rel="noopener" href="https://wa.me/${esc(o.wa)}">WhatsApp</a>`:""}${o.tg?`<a class="soc" target="_blank" rel="noopener" href="https://t.me/${esc(o.tg)}">Telegram</a>`:""}${o.ph?`<a class="soc" href="tel:+${esc(o.ph)}">📞 ${esc(o.ph)}</a>`:""}${[["fb","Facebook"],["ig","Instagram"],["yt","YouTube"],["tt","TikTok"]].filter(([k])=>safeUrl(o[k])).map(([k,l])=>`<a class="soc" target="_blank" rel="noopener" href="${esc(safeUrl(o[k]))}">${l}</a>`).join("")}</div><button class="btn w-full mt-3" data-ofol="${o.id}">${fol?"Following ✓ (tap to unfollow)":"Follow"}</button></div>
 <div class="sh"><i></i><span></span>On sale / upcoming</div>${sel.map(otCard).join("")||'<p class="text-gray-500">None.</p>'}<div class="sh"><i></i><span></span>Last 30 days</div>${L.filter(t=>t.status==="ended"&&t.time>d).map(otCard).join("")||'<p class="text-gray-500">None.</p>'}`}}
